<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Teste CORS</title>
</head>
<body>
  <h1>Teste CORS - Entrega</h1>
  <p>RA: 2025104728 — WESLEY DOS SANTOS DE SOUZA</p>
  <button id="btn">Executar Requisição</button>
  <pre id="output"></pre>

  <script>
    document.getElementById('btn').addEventListener('click', () => {
      fetch('http://localhost:8080/dados', {
        method: 'GET',
        headers: { 'X-Identificador-Estudante': '2025104728' }
      })
      .then(async res => {
        const text = await res.text();
        document.getElementById('output').textContent = `status: ${res.status}\n\n` + text;
        console.log('Resposta:', res);
        console.log('Body:', text);
      })
      .catch(err => {
        document.getElementById('output').textContent = 'Erro: ' + err;
        console.error(err);
      });
    });
  </script>
</body>
</html>
