<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Client - Entrega CORS</title>
</head>
<body>
  <h1>Teste CORS - Entrega</h1>
  <p>RA: 2025104728 - WESLEY DOS SANTOS DE SOUZA</p>
  <button id="executar">Executar Requisição</button>
  <pre id="output"></pre>

  <script>
    document.getElementById('executar').addEventListener('click', () => {
      // fetch configurado conforme especificação (força preflight por usar header personalizado)
      fetch('http://localhost:8080/dados', {
        method: 'GET',
        headers: { 'X-Identificador-Estudante': '2025104728' }
      })
      .then(async (res) => {
        const text = await res.text();
        try {
          const json = JSON.parse(text);
          console.log('Resposta:', json);
          document.getElementById('output').textContent = JSON.stringify(json, null, 2);
        } catch (e) {
          console.log('Resposta bruta:', text);
          document.getElementById('output').textContent = text;
        }
      })
      .catch(err => {
        console.error('Erro:', err);
        document.getElementById('output').textContent = String(err);
      });
    });
  </script>
</body>
</html>
